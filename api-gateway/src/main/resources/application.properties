spring.application.name=api-gateway
server.port=8080

# --- CONEXIÓN A EUREKA ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- CONFIGURACIÓN DE DESCUBRIMIENTO (Actualizada) ---
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# --- RUTAS (Sintaxis Nueva para Spring Cloud 4.3.0+) ---

# Paciente
spring.cloud.gateway.server.webflux.routes[0].id=ms-paciente
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-paciente
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/paciente/**

# Historia
spring.cloud.gateway.server.webflux.routes[1].id=ms-historia
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-historia
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/historia/**

# Personal
spring.cloud.gateway.server.webflux.routes[2].id=ms-personal
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-personal
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/personal/**

# Orquestador
spring.cloud.gateway.server.webflux.routes[3].id=ms-orquestador
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-orquestador
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orquestador/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthenticationFilter

# Programacion
spring.cloud.gateway.server.webflux.routes[4].id=ms-programacion-horario
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ms-programacion-horario
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/programacion/**

# Citas
spring.cloud.gateway.server.webflux.routes[5].id=ms-citas
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ms-citas
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/cita/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=AuthenticationFilter

# Facturacion
spring.cloud.gateway.server.webflux.routes[6].id=ms-facturacion
spring.cloud.gateway.server.webflux.routes[6].uri=lb://ms-facturacion
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/facturacion/**

# Farmacia
spring.cloud.gateway.server.webflux.routes[7].id=ms-farmacia
spring.cloud.gateway.server.webflux.routes[7].uri=lb://ms-farmacia
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/farmacia/**

# Laboratorio
spring.cloud.gateway.server.webflux.routes[8].id=ms-laboratorio
spring.cloud.gateway.server.webflux.routes[8].uri=lb://ms-laboratorio
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/laboratorio/**

# Atención Médica
spring.cloud.gateway.server.webflux.routes[9].id=ms-atencion-medica
spring.cloud.gateway.server.webflux.routes[9].uri=lb://ms-atencion-medica
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/atencion/**

# --- CONFIGURACIÓN CORS (Actualizada para React Vite) ---
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-methods=GET, POST, PUT, DELETE, OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allow-credentials=true

# --- CONFIGURACIÓN DE SWAGGER UI (Centralizado) ---

# Activar Swagger
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Ordenar alfabéticamente los endpoints
springdoc.swagger-ui.operationsSorter=alpha

# --- MAPA DE DOCUMENTACIÓN (Aquí unimos todos) ---

# 1. Paciente
springdoc.swagger-ui.urls[0].name=1. Paciente
springdoc.swagger-ui.urls[0].url=/api/paciente/v3/api-docs

# 2. Historia
springdoc.swagger-ui.urls[1].name=2. Historia
springdoc.swagger-ui.urls[1].url=/api/historia/v3/api-docs

# 3. Personal
springdoc.swagger-ui.urls[2].name=3. Personal
springdoc.swagger-ui.urls[2].url=/api/personal/v3/api-docs

# 4. Programacion
springdoc.swagger-ui.urls[3].name=4. Programación
springdoc.swagger-ui.urls[3].url=/api/programacion/v3/api-docs

# 5. Citas
springdoc.swagger-ui.urls[4].name=5. Citas
springdoc.swagger-ui.urls[4].url=/api/cita/v3/api-docs

# 6. Facturacion
